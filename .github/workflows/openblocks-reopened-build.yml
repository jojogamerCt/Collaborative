name: Build OpenBlocks Reopened

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'openblocks-reopened/**'
      - '.github/workflows/openblocks-reopened-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openblocks-reopened
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Clone complete upstream repositories
        run: |
          rm -rf upstream
          mkdir -p upstream
          git clone --recursive https://github.com/OpenMods/OpenBlocks.git upstream/OpenBlocks
          git clone --recursive https://github.com/OpenMods/OpenModsLib.git upstream/OpenModsLib
          git -C upstream/OpenBlocks bundle create ../OpenBlocks.bundle --all
          git -C upstream/OpenModsLib bundle create ../OpenModsLib.bundle --all
          rm -rf upstream/OpenBlocks/.git upstream/OpenModsLib/.git
          python3 - <<'PY'
          from pathlib import Path
          import json
          result = {}
          for name in ('OpenBlocks', 'OpenModsLib'):
              root = Path('upstream') / name
              result[name] = {
                  'java_files': len(list((root / 'src/main/java').rglob('*.java'))),
                  'resource_files': len([p for p in (root / 'src/main/resources').rglob('*') if p.is_file()]),
                  'total_files': len([p for p in root.rglob('*') if p.is_file()]),
              }
          Path('upstream/source-inventory.json').write_text(json.dumps(result, indent=2))
          PY
      - name: Generate Gradle project
        run: |
          python3 bootstrap_project.py
          sed -i "s/from rootProject.file('LICENSE') {/from(rootProject.file('LICENSE')) {/" fabric/build.gradle forge/build.gradle
      - name: Build loader jars
        run: gradle clean build --stacktrace
      - name: Upload jars, project, and complete upstream source
        uses: actions/upload-artifact@v4
        with:
          name: openblocks-reopened-with-complete-upstream
          path: |
            openblocks-reopened/build/distributions/*.jar
            openblocks-reopened/build.gradle
            openblocks-reopened/settings.gradle
            openblocks-reopened/gradle.properties
            openblocks-reopened/common/**
            openblocks-reopened/fabric/**
            openblocks-reopened/forge/**
            openblocks-reopened/LICENSE
            openblocks-reopened/README.md
            openblocks-reopened/upstream/**
          if-no-files-found: error
