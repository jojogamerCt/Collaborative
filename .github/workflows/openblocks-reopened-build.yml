name: Build OpenBlocks Reopened

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'openblocks-reopened/**'
      - '.github/workflows/openblocks-reopened-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openblocks-reopened
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Generate Gradle project
        run: python3 bootstrap_project.py
      - name: Build loader jars
        run: gradle clean build --stacktrace
      - name: Upload jars and project
        uses: actions/upload-artifact@v4
        with:
          name: openblocks-reopened-1.20.1-alpha
          path: |
            openblocks-reopened/build/distributions/*.jar
            openblocks-reopened/build.gradle
            openblocks-reopened/settings.gradle
            openblocks-reopened/gradle.properties
            openblocks-reopened/common/**
            openblocks-reopened/fabric/**
            openblocks-reopened/forge/**
            openblocks-reopened/LICENSE
            openblocks-reopened/README.md
          if-no-files-found: error
