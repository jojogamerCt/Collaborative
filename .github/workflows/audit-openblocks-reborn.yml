name: Audit, test, and build OpenBlocks Reborn 10.0.0

on:
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/audit-openblocks-reborn.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone modern OpenBlocks port
        run: |
          git clone --branch 1.21.1 --single-branch https://github.com/lingmu0/OpenBlocks-Reborn.git modern-port
          git -C modern-port rev-parse HEAD > modern-port/UPSTREAM_COMMIT.txt
          chmod +x modern-port/gradlew

      - name: Set release version
        run: |
          sed -i 's/^mod_version=.*/mod_version=10.0.0/' modern-port/gradle.properties

      - name: Audit source and feature registrations
        shell: bash
        run: |
          set -euo pipefail
          cd modern-port
          {
            echo "OpenBlocks Reborn modern-port audit"
            echo "Upstream commit: $(cat UPSTREAM_COMMIT.txt)"
            echo "Java files: $(find src -type f -name '*.java' | wc -l)"
            echo "Java lines: $(find src -type f -name '*.java' -print0 | xargs -0 cat | wc -l)"
            echo "Resource files: $(find src/main/resources src/generated/resources -type f 2>/dev/null | wc -l)"
            echo "Unique registration identifiers: $(grep -RhoE 'register\("[a-z0-9_]+' src/main/java 2>/dev/null | sort -u | wc -l)"
            echo "DeferredRegister uses: $(grep -Rho 'DeferredRegister' src/main/java 2>/dev/null | wc -l)"
            echo
            echo "Top-level Java packages:"
            find src/main/java -type f -name '*.java' | sed 's#src/main/java/##' | cut -d/ -f1-4 | sort | uniq -c | sort -nr | head -50
            echo
            echo "Candidate registry identifiers:"
            grep -RhoE 'register\("[a-z0-9_]+' src/main/java 2>/dev/null | sed 's/register("//' | sort -u | head -500
          } | tee OPENBLOCKS_REBORN_AUDIT.txt

      - name: Build release 10.0.0
        working-directory: modern-port
        run: ./gradlew clean build --stacktrace --no-daemon

      - name: Run required GameTests
        working-directory: modern-port
        run: ./gradlew runGameTestServer --stacktrace --no-daemon --console=plain | tee GAMETEST_LOG.txt

      - name: Package source snapshot
        if: always()
        run: |
          rm -rf modern-port/.git modern-port/.gradle modern-port/run modern-port/build/tmp modern-port/build/classes
          tar -czf OpenBlocks-Reborn-10.0.0-source.tar.gz modern-port

      - name: Upload release, test log, and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openblocks-reborn-10.0.0-verified-build
          path: |
            modern-port/build/libs/*.jar
            modern-port/OPENBLOCKS_REBORN_AUDIT.txt
            modern-port/GAMETEST_LOG.txt
            modern-port/UPSTREAM_COMMIT.txt
            modern-port/gradle.properties
            OpenBlocks-Reborn-10.0.0-source.tar.gz
          if-no-files-found: warn
